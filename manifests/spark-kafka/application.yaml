# Stackable SparkApplication: subscribe to Streams for Apache Kafka topic
# churn-events, score via /predict. Opt-in via scripts/run-spark-kafka.sh.
apiVersion: spark.stackable.tech/v1alpha1
kind: SparkApplication
metadata:
  name: spark-from-kafka-churn
  namespace: ocp-datalake
  labels:
    app.kubernetes.io/name: spark-from-kafka-churn
    app.kubernetes.io/part-of: ocp-datalake
spec:
  sparkImage:
    productVersion: "3.5.8"
  mode: cluster
  mainApplicationFile: local:///arguments/stream.py
  deps:
    packages:
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.8
  env:
    - name: KAFKA_BOOTSTRAP
      value: churn-kafka-bootstrap.kafka.svc:9092
    - name: KAFKA_TOPIC
      value: churn-events
    - name: PREDICT_URL
      value: http://inference.ocp-datalake.svc:4180/predict
  volumes:
    - name: job-script
      configMap:
        name: spark-kafka-script
  job:
    config:
      resources:
        cpu:
          min: "250m"
          max: "1"
        memory:
          limit: "1Gi"
      volumeMounts:
        - name: job-script
          mountPath: /arguments
  driver:
    config:
      resources:
        cpu:
          min: "250m"
          max: "1"
        memory:
          limit: "1Gi"
      volumeMounts:
        - name: job-script
          mountPath: /arguments
  executor:
    replicas: 1
    config:
      resources:
        cpu:
          min: "250m"
          max: "1"
        memory:
          limit: "1Gi"
      volumeMounts:
        - name: job-script
          mountPath: /arguments
