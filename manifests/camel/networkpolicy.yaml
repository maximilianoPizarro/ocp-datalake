# Web Terminal and other namespaces cannot reach Services here (same as inference).
# Clients use Route churn-camel; OpenShift ingress is allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: camel-churn-score-bridge-ingress
  namespace: ocp-datalake
  labels:
    app.kubernetes.io/name: churn-score-bridge
    app.kubernetes.io/part-of: ocp-datalake
spec:
  podSelector:
    matchLabels:
      camel.apache.org/integration: churn-score-bridge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
