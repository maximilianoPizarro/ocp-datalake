# Maps a Spark-shaped enterprise record to churn-score /predict.
# Input:  {"customer_id":"...","source":"spark-batch","features":{"account_tenure_months":12,"monthly_charges":70,"open_support_tickets":3}}
# Output: same as POST http://inference.ocp-datalake.svc:4180/predict
apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: churn-score-bridge
  namespace: ocp-datalake
  labels:
    app: churn-score-bridge
    app.kubernetes.io/name: churn-score-bridge
    app.kubernetes.io/part-of: ocp-datalake
spec:
  traits:
    service:
      enabled: true
    container:
      requestCPU: 50m
      requestMemory: 256Mi
      limitCPU: 500m
      limitMemory: 512Mi
  flows:
    - from:
        uri: "platform-http:/score?httpMethodRestrict=POST"
        steps:
          - unmarshal:
              json: {}
          - setBody:
              simple: >-
                {"tenure":${body[features][account_tenure_months]},"charges":${body[features][monthly_charges]},"support_tickets":${body[features][open_support_tickets]}}
          - setHeader:
              name: Content-Type
              constant: application/json
          - setHeader:
              name: CamelHttpMethod
              constant: POST
          - to:
              uri: "http://inference.ocp-datalake.svc:4180/predict?bridgeEndpoint=true"
