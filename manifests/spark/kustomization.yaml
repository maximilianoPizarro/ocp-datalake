# One-shot Spark batch. Not an Argo app: a permanent SparkApplication
# re-fires when the spec is reapplied. scripts/run-spark-score.sh applies this
# after inference exists. The ConfigMap is generated from score.py so the
# script is not the only copy of that object.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ocp-datalake
resources:
  - rbac.yaml
  - application.yaml
configMapGenerator:
  - name: spark-score-script
    files:
      - score.py
    options:
      disableNameSuffixHash: true
labels:
  - pairs:
      app.kubernetes.io/part-of: ocp-datalake
    includeSelectors: false
