apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: ocp-datalake
  labels:
    app.kubernetes.io/name: inference
    app.kubernetes.io/part-of: ocp-datalake
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference
        app.kubernetes.io/part-of: ocp-datalake
    spec:
      serviceAccountName: inference
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth-proxy
          image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:v4.18
          imagePullPolicy: IfNotPresent
          args:
            - --http-address=:4180
            - --https-address=
            - --provider=openshift
            - --openshift-service-account=inference
            - --upstream=http://churn-score-predictor.ocp-datalake.svc:8080
            - --cookie-secret-file=/etc/proxy/secret/cookie-secret
            - --cookie-secure=true
            - --pass-access-token=true
            - --skip-auth-regex=^/healthz
            - --skip-auth-regex=^/readyz
            - --skip-auth-regex=^/metrics
            - --skip-auth-regex=^/predict
            - --skip-auth-regex=^/model
            - --skip-auth-regex=^/v1
            - --skip-auth-regex=^/v2
          ports:
            - name: public
              containerPort: 4180
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: proxy-secret
              mountPath: /etc/proxy/secret
              readOnly: true
      volumes:
        - name: proxy-secret
          secret:
            secretName: oauth-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: ocp-datalake
  labels:
    app.kubernetes.io/name: inference
    app.kubernetes.io/part-of: ocp-datalake
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: inference-tls
spec:
  selector:
    app.kubernetes.io/name: inference
  ports:
    - name: public
      port: 4180
      targetPort: public
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: inference
  namespace: ocp-datalake
  labels:
    app.kubernetes.io/name: inference
    app.kubernetes.io/part-of: ocp-datalake
spec:
  to:
    kind: Service
    name: inference
  port:
    targetPort: public
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
