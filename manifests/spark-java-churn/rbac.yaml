# OpenShift SCC for the ServiceAccount Stackable creates (same name as the
# SparkApplication). Same pattern as the Python / SparkPi jobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spark-java-churn-score-anyuid
  labels:
    app.kubernetes.io/name: spark-java-churn-score
    app.kubernetes.io/part-of: ocp-datalake
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: spark-java-churn-score
    namespace: ocp-datalake
