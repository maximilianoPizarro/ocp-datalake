# Custom Java churn Spark job. SparkApplication is applied by Tekton (not Argo).
# ImageStream + RBAC can also be applied by scripts/run-spark-java-churn.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ocp-datalake
resources:
  - imagestream.yaml
  - rbac.yaml
  - application.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: ocp-datalake
    includeSelectors: false
