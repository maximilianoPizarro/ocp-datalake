apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: simulator-premium
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: Simulator Premium Tier
    openshift.io/description: Premium tier: 100000 tokens/min for all authenticated users
  labels:
    app.kubernetes.io/part-of: ocp-datalake-maas
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: facebook-opt-125m-simulated
      namespace: llm
      tokenRateLimits:
        - limit: 100000
          window: 1m
  priority: 20
