apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kuadrant-namespace.yaml
  - authorino-service.yaml
  - kuadrant.yaml
  - gatewayclass.yaml
  - gateway-resources.yaml
# Authorino CR is applied after Kuadrant is Ready (scripts/enable-maas.sh).
# Gateway is rendered from gateway.yaml.tmpl (cluster domain + default TLS secret).
