apiVersion: batch/v1
kind: Job
metadata:
  name: maas-ensure-db-secrets
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: maas-db-bootstrap
      containers:
        - name: ensure
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              NS=redhat-ods-applications
              GW=redhat-ai-gateway-infra
              if oc get secret postgres-creds -n "$NS" >/dev/null 2>&1; then
                echo "postgres-creds already exists"
              else
                PW="$(head -c 18 /dev/urandom | base64 | tr -d '=+/' | head -c 24)"
                oc create secret generic postgres-creds -n "$NS" \
                  --from-literal=POSTGRES_USER=maas \
                  --from-literal=POSTGRES_PASSWORD="$PW" \
                  --from-literal=POSTGRES_DB=maas
                oc create secret generic maas-db-config -n "$NS" \
                  --from-literal=DB_CONNECTION_URL="postgresql://maas:${PW}@postgres:5432/maas?sslmode=disable"
              fi
              PW="$(oc get secret postgres-creds -n "$NS" -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)"
              oc create namespace "$GW" --dry-run=client -o yaml | oc apply -f -
              oc create secret generic maas-db-config -n "$GW" \
                --from-literal=DB_CONNECTION_URL="postgresql://maas:${PW}@postgres.redhat-ods-applications.svc.cluster.local:5432/maas?sslmode=disable" \
                --dry-run=client -o yaml | oc apply -f -
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-db-bootstrap
  namespace: redhat-ods-applications
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-db-bootstrap
  namespace: redhat-ods-applications
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-db-bootstrap
  namespace: redhat-ods-applications
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-db-bootstrap
subjects:
  - kind: ServiceAccount
    name: maas-db-bootstrap
    namespace: redhat-ods-applications
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-db-bootstrap
  namespace: redhat-ai-gateway-infra
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-db-bootstrap
  namespace: redhat-ai-gateway-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-db-bootstrap
subjects:
  - kind: ServiceAccount
    name: maas-db-bootstrap
    namespace: redhat-ods-applications
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maas-db-bootstrap-ns
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maas-db-bootstrap-ns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: maas-db-bootstrap-ns
subjects:
  - kind: ServiceAccount
    name: maas-db-bootstrap
    namespace: redhat-ods-applications
