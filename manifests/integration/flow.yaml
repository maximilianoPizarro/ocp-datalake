# Ephemeral Quick Try flow (OpenShift Integration Operator).
# Spark-shaped record -> churn-score /predict. No Spark cluster.
# Input:  {"customer_id":"C-1001","source":"spark-batch","features":{"account_tenure_months":12,"monthly_charges":70,"open_support_tickets":3}}
# Output: same body as POST http://inference.ocp-datalake.svc:4180/predict
apiVersion: platform.io/v1alpha1
kind: IntegrationFlow
metadata:
  name: spark-to-churn-score
  namespace: ocp-datalake
  labels:
    app.kubernetes.io/name: spark-to-churn-score
    app.kubernetes.io/part-of: ocp-datalake
spec:
  deploymentMode: EPHEMERAL
  engine: CAMEL
  integrationType: CAMEL_ROUTE
  ephemeral:
    ttlSeconds: 28800
    workerImage: quay.io/maximilianopizarro/camel-worker-http:v0.8.2
  targeting:
    strategy: explicit
    clusters:
      - local
  kaotoDesign: |
    - route:
        id: spark-batch-in
        description: Spark batch JSON (customer_id, source, features)
        from:
          uri: "platform-http:/spark/score?httpMethodRestrict=POST"
          steps:
            - log:
                id: spark-batch-record
                message: "Spark batch ${body}"
            - to:
                id: to-feature-map
                uri: "direct:spark-features-to-predict"
    - route:
        id: score-alias
        description: Alias of /spark/score
        from:
          uri: "platform-http:/score?httpMethodRestrict=POST"
          steps:
            - to:
                uri: "direct:spark-features-to-predict"
    - route:
        id: spark-features-to-predict
        description: Map Spark features onto churn-score /predict
        from:
          uri: "direct:spark-features-to-predict"
          steps:
            - setHeader:
                id: map-tenure-from-spark
                name: tenure
                jsonpath: "$.features.account_tenure_months"
            - setHeader:
                id: map-charges-from-spark
                name: charges
                jsonpath: "$.features.monthly_charges"
            - setHeader:
                id: map-support-tickets-from-spark
                name: tickets
                jsonpath: "$.features.open_support_tickets"
            - setBody:
                id: build-predict-body
                simple: '{"tenure":${header.tenure},"charges":${header.charges},"support_tickets":${header.tickets}}'
            - removeHeaders:
                pattern: "CamelHttp*"
            - setHeader:
                name: Content-Type
                constant: application/json
            - setHeader:
                name: CamelHttpMethod
                constant: POST
            - to:
                id: openshift-ai-churn-score
                uri: "http://inference.ocp-datalake.svc:4180/predict?bridgeEndpoint=true"
