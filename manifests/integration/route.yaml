# Service iflow-churn-score-bridge is created by the operator with an unnamed
# port 8080. enable-integration.sh names that port http before this Route is applied.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: churn-camel
  namespace: ocp-datalake
  labels:
    app.kubernetes.io/name: churn-score-bridge
    app.kubernetes.io/part-of: ocp-datalake
spec:
  to:
    kind: Service
    name: iflow-churn-score-bridge
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
