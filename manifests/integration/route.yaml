# First port on Service iflow-churn-score-bridge is 8080 (unnamed). Leave spec.port unset.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: churn-camel
  namespace: ocp-datalake
  labels:
    app.kubernetes.io/name: churn-score-bridge
    app.kubernetes.io/part-of: ocp-datalake
spec:
  to:
    kind: Service
    name: iflow-churn-score-bridge
    weight: 100
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
