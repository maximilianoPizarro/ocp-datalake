apiVersion: v1
kind: Secret
metadata:
  name: ocp-datalake-registry-db
  namespace: rhoai-model-registries
  labels:
    app.kubernetes.io/part-of: ocp-datalake
stringData:
  database-name: ocp-datalake-registry
  database-password: ocp-datalake-registry-poc
  database-user: modelregistryuser
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ocp-datalake-registry-db
  namespace: rhoai-model-registries
  labels:
    app.kubernetes.io/part-of: ocp-datalake
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: gp3-csi
---
apiVersion: v1
kind: Service
metadata:
  name: ocp-datalake-registry-db
  namespace: rhoai-model-registries
  labels:
    app.kubernetes.io/part-of: ocp-datalake
spec:
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: ocp-datalake-registry-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocp-datalake-registry-db
  namespace: rhoai-model-registries
  labels:
    app.kubernetes.io/name: ocp-datalake-registry-db
    app.kubernetes.io/part-of: ocp-datalake
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ocp-datalake-registry-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocp-datalake-registry-db
        app.kubernetes.io/part-of: ocp-datalake
    spec:
      containers:
        - name: postgresql
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ocp-datalake-registry-db
                  key: database-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocp-datalake-registry-db
                  key: database-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ocp-datalake-registry-db
                  key: database-name
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ocp-datalake-registry-db
---
apiVersion: modelregistry.opendatahub.io/v1beta1
kind: ModelRegistry
metadata:
  name: ocp-datalake-registry
  namespace: rhoai-model-registries
  labels:
    app.kubernetes.io/part-of: ocp-datalake
    opendatahub.io/dashboard: "true"
spec:
  rest:
    port: 8080
    serviceRoute: disabled
  postgres:
    host: ocp-datalake-registry-db
    port: 5432
    database: ocp-datalake-registry
    username: modelregistryuser
    passwordSecret:
      name: ocp-datalake-registry-db
      key: database-password
