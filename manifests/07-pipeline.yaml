apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: seed-databricks-registry
  namespace: ocp-datalake
  labels:
    app.kubernetes.io/part-of: ocp-datalake
spec:
  description: Publish a versioned model artifact into the registry volume (Databricks stand-in).
  workspaces:
    - name: assets
    - name: registry
  steps:
    - name: put
      image: image-registry.openshift-image-registry.svc:5000/openshift/python:3.12-ubi9
      imagePullPolicy: IfNotPresent
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
      env:
        - name: MODEL_KEY
          valueFrom:
            configMapKeyRef:
              name: ml-runtime
              key: MODEL_KEY
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        dest="$(workspaces.registry.path)/${MODEL_KEY}"
        mkdir -p "$(dirname "$dest")"
        python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$(workspaces.assets.path)/model.json"
        cp "$(workspaces.assets.path)/model.json" "$dest"
        echo "put file://${dest}"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pull-validate-model
  namespace: ocp-datalake
  labels:
    app.kubernetes.io/part-of: ocp-datalake
spec:
  description: Validate the registry artifact and publish it as a ConfigMap.
  workspaces:
    - name: assets
    - name: registry
    - name: scratch
  steps:
    - name: validate
      image: image-registry.openshift-image-registry.svc:5000/openshift/python:3.12-ubi9
      imagePullPolicy: IfNotPresent
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
      env:
        - name: MODEL_KEY
          valueFrom:
            configMapKeyRef:
              name: ml-runtime
              key: MODEL_KEY
        - name: REGISTRY
          value: $(workspaces.registry.path)
        - name: SCRATCH
          value: $(workspaces.scratch.path)
      script: |
        #!/usr/bin/env python3
        import json, os, pathlib, shutil, sys
        src = pathlib.Path(os.environ["REGISTRY"]) / os.environ["MODEL_KEY"]
        required = ("name", "version", "weights", "bias", "threshold")
        model = json.loads(src.read_text(encoding="utf-8"))
        missing = [k for k in required if k not in model]
        if missing:
            sys.exit(f"invalid artifact, missing: {', '.join(missing)}")
        dest = pathlib.Path(os.environ["SCRATCH"]) / "model.json"
        shutil.copy(src, dest)
        print(f"valid model={model['name']} version={model['version']} source={model.get('source')}", flush=True)
    - name: publish
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      imagePullPolicy: IfNotPresent
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        oc create configmap model-artifact \
          --from-file=model.json="$(workspaces.scratch.path)/model.json" \
          -n ocp-datalake \
          --dry-run=client -o yaml | oc apply -f -
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: register-model-registry
  namespace: ocp-datalake
  labels:
    app.kubernetes.io/part-of: ocp-datalake
spec:
  description: Publish churn-score v1 to the OpenShift AI Model Registry.
  workspaces:
    - name: assets
  volumes:
    - name: service-ca
      configMap:
        name: openshift-service-ca.crt
  steps:
    - name: register
      image: image-registry.openshift-image-registry.svc:5000/openshift/python:3.12-ubi9
      imagePullPolicy: IfNotPresent
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
      volumeMounts:
        - name: service-ca
          mountPath: /etc/openshift-service-ca
          readOnly: true
      env:
        - name: MR_HOST
          value: https://ocp-datalake-registry.rhoai-model-registries.svc:8443
        - name: ARTIFACT_URI
          value: pvc://databricks-ml-registry/models/churn-score/1
      script: |
        #!/usr/bin/env python3
        import runpy
        runpy.run_path("$(workspaces.assets.path)/register_model.py", run_name="__main__")
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rollout-inference
  namespace: ocp-datalake
  labels:
    app.kubernetes.io/part-of: ocp-datalake
spec:
  steps:
    - name: oc
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      imagePullPolicy: IfNotPresent
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        oc rollout restart deployment/churn-score-predictor -n ocp-datalake
        oc wait --for=condition=Ready inferenceservice/churn-score -n ocp-datalake --timeout=180s
        oc rollout restart deployment/inference -n ocp-datalake
        oc rollout status deployment/inference -n ocp-datalake --timeout=180s
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: notebook-to-openshift
  namespace: ocp-datalake
  labels:
    app.kubernetes.io/part-of: ocp-datalake
spec:
  description: Databricks-style registry publish, then OpenShift pull/validate/serve.
  workspaces:
    - name: assets
    - name: registry
    - name: scratch
  tasks:
    - name: seed
      taskRef:
        name: seed-databricks-registry
      workspaces:
        - name: assets
          workspace: assets
        - name: registry
          workspace: registry
    - name: pull
      runAfter: ["seed"]
      taskRef:
        name: pull-validate-model
      workspaces:
        - name: assets
          workspace: assets
        - name: registry
          workspace: registry
        - name: scratch
          workspace: scratch
    - name: register
      runAfter: ["pull"]
      taskRef:
        name: register-model-registry
      workspaces:
        - name: assets
          workspace: assets
    - name: rollout
      runAfter: ["register"]
      taskRef:
        name: rollout-inference
