apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ocp-datalake
resources:
  - pvc.yaml
  - serviceaccount.yaml
  - networkpolicy.yaml
  - notebook.yaml
# ConfigMap workbench-demo-notebook is generated from the repo-root kustomization
# (notebooks/ocp-datalake-demo.ipynb). scripts/enable-workbench.sh creates it too.
labels:
  - pairs:
      app.kubernetes.io/part-of: ocp-datalake
    includeSelectors: false
