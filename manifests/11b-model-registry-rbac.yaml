# Allow pipeline ServiceAccounts in ocp-datalake to pass kube-rbac-proxy on the registry.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ocp-datalake-registry-pipeline-access
  namespace: rhoai-model-registries
  labels:
    app.kubernetes.io/part-of: ocp-datalake
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-user-ocp-datalake-registry
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: ocp-datalake
  - kind: ServiceAccount
    name: pipeline-runner-dspa
    namespace: ocp-datalake
---
# Pipeline pods in ocp-datalake are not RHOAI-generated namespaces; open 8443 explicitly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ocp-datalake-registry-pipeline-ingress
  namespace: rhoai-model-registries
  labels:
    app.kubernetes.io/part-of: ocp-datalake
spec:
  podSelector:
    matchLabels:
      app: ocp-datalake-registry
      app.kubernetes.io/name: ocp-datalake-registry
      component: model-registry
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ocp-datalake
      ports:
        - protocol: TCP
          port: 8443
