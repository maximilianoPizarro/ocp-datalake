apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ocp-datalake-maas-operators
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: ocp-datalake
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/maximilianoPizarro/ocp-datalake.git
    targetRevision: main
    path: manifests/maas/operators
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-operators
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
